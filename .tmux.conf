bind r source-file ~/.tmux.conf

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

set -g focus-events on
set -g history-limit 8888

set -g pane-active-border-style 'fg=#00ffff'
set -g pane-border-status off
set -g pane-border-lines heavy

set -g status-style 'fg=#d0d0d0 bg=#304050'
set -g status-left '[#S]'
set -g status-left-length 40
set -g status-right '%Y-%m-%d %H:%M '
setw -g window-status-format ' #I #W #F '
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-current-style 'bg=#506070 bold'

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind p paste-buffer

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R
unbind Up
unbind Down
unbind Left
unbind Right
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right


set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @smooth-scroll-speed '70'
set -g @smooth-scroll-easing 'sine'

run '~/.tmux/plugins/tpm/tpm'
